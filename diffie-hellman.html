<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Алгоритм Діффі — Хеллмана</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <button type="button" id="back-btn"><-</button>
        <section>
            <h3>Спільні параметри</h3>

            <label for="dh-p">Просте число p:</label>
            <input type="number" id="dh-p" min="3" placeholder="Введіть p">

            <label for="dh-g">Генератор g:</label>
            <input type="number" id="dh-g" min="2" placeholder="Введіть g">
        </section>

        <section class="clients">
            <div class="client">
                <h3>Клієнт А</h3>

                <label for="dh-a">Секретне число A:</label>
                <input type="number" id="dh-a" min="1"
                       placeholder="Введіть A">

                <p>Відкритий ключ rA:</p>
                <output id="dh-rA">—</output>

                <p>Спільний ключ KA:</p>
                <output id="dh-keyA">—</output>
            </div>

            <div class="client">
                <h3>Клієнт В</h3>

                <label for="dh-b">Секретне число B:</label>
                <input type="number" id="dh-b" min="1"
                       placeholder="Введіть B">

                <p>Відкритий ключ rB:</p>
                <output id="dh-rB">—</output>

                <p>Спільний ключ KB:</p>
                <output id="dh-keyB">—</output>
            </div>
        </section>

        <button type="button" id="dh-calculate">
            Обчислити ключі
        </button>

        <button type="button" id="dh-clear">
            Очистити
        </button>

        <p id="dh-error" role="alert"></p>
        <p id="dh-result"></p>
    </main>

    <script type="module" src="diffie-hellman.js"></script>
</body>
</html>
