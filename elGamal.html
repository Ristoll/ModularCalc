<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Алгоритм Ель Гамаля</title>
    <link rel="stylesheet" href="../styles/style.css">
</head>
<body>

    <main class="container">
        <h1>Алгоритм шифрування Ель Гамаля</h1>

        <section>
            <h2>1. Параметри системи</h2>

            <label for="p">Простий модуль p:</label>
            <input type="number" id="p" value="37">

            <button id="findGenerators">Знайти генератори</button>

            <div id="generatorsResult"></div>

            <label for="g">Генератор g:</label>
            <input type="number" id="g" placeholder="Введіть генератор">
        </section>

        <section>
            <h2>2. Генерація ключів</h2>

            <label for="x">Закритий ключ x:</label>
            <input type="number" id="x" placeholder="Введіть закритий ключ">

            <button id="generateKeys">Згенерувати ключі</button>

            <div id="keysResult"></div>
        </section>

        <section>
            <h2>3. Шифрування повідомлення</h2>

            <label for="message">Повідомлення (3 літери):</label>
            <input type="text" id="message" maxlength="3" placeholder="ABC">

            <label for="k1">Сесійний ключ k1:</label>
            <input type="number" id="k1">

            <label for="k2">Сесійний ключ k2:</label>
            <input type="number" id="k2">

            <label for="k3">Сесійний ключ k3:</label>
            <input type="number" id="k3">

            <button id="encrypt">Зашифрувати</button>

            <div id="encryptionResult"></div>
        </section>

        <section>
            <h2>4. Розшифрування повідомлення</h2>

            <button id="decrypt">Розшифрувати</button>

            <div id="decryptionResult"></div>
        </section>

        <div id="errorResult"></div>
    </main>

    <script type="module" src="./elGamal.js"></script>
</body>
</html>
